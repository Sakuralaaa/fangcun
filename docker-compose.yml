services:
  fangcun:
    image: ghcr.io/sakuralaaa/fangcun:latest
    # build: .                       # 想本地自己构建就改用这一行
    container_name: fangcun
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai              # 每日自动备份按这个时区判断「今天」
      # Komari 管理员 API Key（只读使用）；不接 Komari 可删掉这一行
      KOMARI_API_KEY: ${KOMARI_API_KEY:-}
      # 放在 HTTPS 反向代理后面时设为 1，会话 cookie 带 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - ./data:/data                 # 数据库、附件、自动备份都在这里
