name: CLIProxyAPI 插件

# Every v* release also ships the CLIProxyAPI plugin (fangcun_<ver>_linux_<arch>.zip + checksums.txt),
# so the plugin store's github-release install (latest release of this repo) always finds it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: plugins/cliproxyapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/cliproxyapi/go.mod
          cache-dependency-path: plugins/cliproxyapi/go.sum
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X github.com/Sakuralaaa/fangcun/plugins/cliproxyapi/internal/feed.Version=${V}" -buildmode=c-shared -o fangcun.so ./cmd/plugin
          zip -j "fangcun_${V}_linux_${{ matrix.arch }}.zip" fangcun.so
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.arch }}
          path: plugins/cliproxyapi/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.zip > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            checksums.txt
